name: Mirror image to Docker Hub (one-off)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to mirror from GHCR to Docker Hub"
        required: true
        default: "v0.1.2"

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy manifest from GHCR to Docker Hub
        run: |
          docker buildx imagetools create \
            -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/frigate-notify-plus:${{ inputs.tag }} \
            -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/frigate-notify-plus:latest \
            ghcr.io/izerok/frigate-notify-plus:${{ inputs.tag }}
